<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quimera &bull; Ecosistema Científico, Académico y Profesional</title>
    <style>
        :root {
            --card-bg: rgba(15, 23, 42, 0.90);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #0f766e;
            --accent: #dc2626;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(rgba(11, 19, 41, 0.85), rgba(11, 19, 41, 0.10)), url('Quimera.png');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Header Superior Izquierda */
        .top-header {
            position: absolute;
            top: 0;
            left: 0;
            padding: 1.5rem 2rem;
            z-index: 10;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .top-header.visible {
            opacity: 1;
        }

        .top-header a {
            color: #f8fafc;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
        }

        .top-header a:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        /* Capa de desvanecimiento inicial */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: background 0.5s ease, opacity 0.5s ease;
        }

        /* Contenedor Principal Centrado */
        .main-wrapper {
            max-width: 900px;
            margin: auto;
            padding: 2.5rem 1.5rem;
            text-align: center;
            width: 100%;
        }

        /* Título Principal ECOSISTEMA */
        .page-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            min-height: 1.6em;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .page-title.visible {
            opacity: 1;
        }

        /* Subtítulo QUIMERA */
        .quimera-word-container {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 6rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            margin-bottom: 1.5rem;
            display: inline-block;
            cursor: default;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .quimera-word-container.visible {
            opacity: 1;
        }

        .quimera-letter {
            display: inline-block;
            color: transparent;
            transition: color 0.4s ease;
        }

        /* Subtítulo de texto */
        .subtitle-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            color: #e2e8f0;
            min-height: 1.6em;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .subtitle-text.visible {
            opacity: 1;
        }

        /* Recuadro de instrucciones interactivo */
        .exploration-box {
            max-width: 900px;
            margin: 0 auto 1.5rem auto;
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 0.95rem;
            color: #cbd5e1;
            opacity: 0;
            transition: opacity 0.8s ease;
            width: calc(100% - 3rem);
        }

        .exploration-box.visible {
            opacity: 1;
        }

        .exploration-box p {
            text-align: center;
            line-height: 1.6;
        }

        #exp-title {
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #ffffff;
            min-height: 1.5em;
        }

        #exp-desc {
            min-height: 3em;
        }

        /* Cursor de máquina de escribir */
        .tw-cursor {
            display: inline-block;
            background-color: #38bdf8;
            width: 8px;
            height: 1.1rem;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Recuadro Central Modal */
        #modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        #modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 750px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            text-align: left;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-box h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .modal-box p, .modal-box li {
            font-size: 1.02rem;
            color: #f1f5f9;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .modal-box ul {
            padding-left: 1.25rem;
            margin-bottom: 1rem;
        }

        .process-flow {
            background: rgba(15, 118, 110, 0.2);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            margin: 1rem 0;
            color: #5eead4;
        }

        .close-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #f43f5e;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .close-link:hover {
            color: #fb7185;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            background: rgba(11, 19, 41, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 1s ease;
        }

        footer.visible {
            opacity: 1;
        }

        footer p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 0.25rem;
            color: #e2e8f0;
            min-height: 1.6em;
            transition: opacity 0.4s ease;
        }
    </style>
</head>
<body>

    <!-- Header con hipervínculo en la parte superior izquierda -->
    <header class="top-header" id="top-header">
        <a href="https://quimerac3.github.io/" id="header-link"></a>
    </header>

    <!-- Capa de desvanecimiento inicial -->
    <div id="intro-overlay"></div>

    <!-- Contenedor Principal Centrado -->
    <main class="main-wrapper">
        <!-- Título ECOSISTEMA -->
        <h1 class="page-title" id="main-title"></h1>

        <!-- Subtítulo QUIMERA -->
        <div class="quimera-word-container" id="quimera-word"><span class="quimera-letter" data-index="0">Q</span><span class="quimera-letter" data-index="1">U</span><span class="quimera-letter" data-index="2">I</span><span class="quimera-letter" data-index="3">M</span><span class="quimera-letter" data-index="4">E</span><span class="quimera-letter" data-index="5">R</span><span class="quimera-letter" data-index="6">A</span></div>

        <!-- Subtítulo de texto -->
        <div class="subtitle-text" id="sub-text"></div>
    </main>

    <!-- Recuadro de instrucciones de la exploración interactiva -->
    <div class="exploration-box" id="exp-box">
        <p id="exp-title"></p>
        <p id="exp-desc"></p>
    </div>

    <!-- Footer y texto del footer -->
    <footer id="main-footer">
        <p id="footer-text-1"></p>
        <p id="footer-text-2"></p>
    </footer>

    <!-- Recuadro Central (Modal) -->
    <div id="modal-backdrop">
        <div class="modal-box" id="modal-content-box">
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
            <div><span class="close-link" id="modal-close-btn">Cerrar.</span></div>
        </div>
    </div>

    <script>
        // Limpieza de caché al retroceder (BFCache)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                window.location.reload();
            }
        });

        // Textos del sistema y modales
        const modalData = [
            {
                title: "Fundamentos del Ecosistema.",
                content: [
                    { type: 'p', text: "Quimera es un ecosistema científico, académico y profesional dedicado a generar, integrar, desarrollar y transferir conocimiento." },
                    { type: 'p', text: "Su propósito nace de una premisa sencilla: Los problemas complejos requieren algo más que conocimiento especializado. Requieren la capacidad de conectar conocimientos." },
                    { type: 'p', text: "Por ello, Quimera reúne diferentes disciplinas, metodologías y campos profesionales relacionados con la ciencia, la salud, la medicina, la comunicación, el lenguaje, la educación y la tecnología, creando un espacio en el que el conocimiento puede ser estudiado, cuestionado, organizado, enseñado y aplicado." }
                ]
            },
            {
                title: "Más que información: conocimiento con propósito.",
                content: [
                    { type: 'p', text: "Quimera no busca simplemente acumular información. Busca transformar la información en conocimiento comprensible, fundamentado y aplicable." },
                    { type: 'p', text: "Para ello, cada proyecto puede recorrer un proceso continuo:" },
                    { type: 'flow', text: "PREGUNTA → INVESTIGACIÓN → ANÁLISIS → CONOCIMIENTO → DESARROLLO → FORMACIÓN → APLICACIÓN → EVALUACIÓN" },
                    { type: 'p', text: "De esta manera, la investigación puede convertirse en formación; la formación, en práctica; y la práctica, nuevamente, en nuevas preguntas que impulsen el conocimiento." }
                ]
            },
            {
                title: "Un espacio interdisciplinario.",
                content: [
                    { type: 'p', text: "Las fronteras entre disciplinas no siempre corresponden a las fronteras de los problemas reales. Por ello, Quimera favorece la interacción entre campos como:" },
                    { type: 'ul', items: [
                        "Medicina y ciencias de la salud.",
                        "Medicina genómica y biotecnología.",
                        "Medicina Basada en Evidencia.",
                        "Bioestadística y metodología de la investigación.",
                        "Medical Affairs.",
                        "Medical Writing y comunicación científica.",
                        "Interpretación médica.",
                        "Traducción médica y científica.",
                        "Educación y desarrollo profesional.",
                        "Inteligencia Artificial y tecnología aplicada al conocimiento."
                    ]},
                    { type: 'p', text: "La interdisciplinariedad de Quimera no significa mezclar disciplinas indiscriminadamente, sino conectarlas conservando el rigor, los métodos y los límites propios de cada una." }
                ]
            },
            {
                title: "Conocimiento, metodología y aplicación.",
                content: [
                    { type: 'p', text: "Quimera entiende que el conocimiento adquiere verdadero potencial cuando existe una relación coherente entre:" },
                    { type: 'flow', text: "QUÉ SABEMOS ↓ CÓMO LO SABEMOS ↓ CÓMO LO COMPRENDEMOS ↓ CÓMO LO APLICAMOS ↓ QUÉ RESULTADOS OBTENEMOS" },
                    { type: 'p', text: "Por ello, la metodología constituye un componente transversal de su desarrollo. Investigar, analizar, enseñar, interpretar, traducir, comunicar o intervenir son actividades diferentes; sin embargo, todas requieren procesos que permitan fundamentar decisiones y evaluar sus consecuencias." }
                ]
            },
            {
                title: "Del conocimiento a la transferencia.",
                content: [
                    { type: 'p', text: "Una de las funciones centrales de Quimera es la transferencia del conocimiento. Esto significa convertir conocimiento especializado en recursos capaces de llegar a quienes pueden utilizarlo:" },
                    { type: 'ul', items: [
                        "Profesionales.",
                        "Investigadores.",
                        "Docentes.",
                        "Estudiantes.",
                        "Intérpretes.",
                        "Traductores.",
                        "Comunicadores.",
                        "Organizaciones.",
                        "Comunidades relacionadas con la salud."
                    ]},
                    { type: 'p', text: "Esta transferencia puede materializarse mediante: investigación, cursos, series pedagógicas, guías, publicaciones, infografías, herramientas, metodologías, recursos digitales y servicios profesionales." }
                ]
            },
            {
                title: "C3 Nexus.",
                content: [
                    { type: 'p', text: "Dentro del ecosistema Quimera se desarrolla C³ Nexus, concebido como una infraestructura digital para conectar, organizar, desarrollar y transferir conocimiento." },
                    { type: 'p', text: "A través de C³ Nexus podrán converger recursos educativos, publicaciones, series pedagógicas, guías, herramientas, bases de conocimiento y otros desarrollos digitales." },
                    { type: 'p', text: "Así: Quimera constituye el ecosistema; C³ Nexus constituye una de sus principales infraestructuras digitales de conexión y transferencia del conocimiento." }
                ]
            },
            {
                title: "Una estructura en evolución.",
                content: [
                    { type: 'p', text: "Quimera no pretende ser una estructura estática. Sus áreas, proyectos, metodologías y recursos podrán evolucionar conforme evolucionen la ciencia, la tecnología y las necesidades de las profesionales y las comunidades a las que sirve." },
                    { type: 'p', text: "Lo que permanece es su orientación: comprender antes de intervenir; fundamentar antes de afirmar; integrar antes de fragmentar; y evaluar para poder mejorar." },
                    { type: 'p', text: "Quimera existe para convertir preguntas en conocimiento, conocimiento en capacidad y capacidad en práctica responsable." }
                ]
            }
        ];

        const headerLinkString = "QUIMERA - Inicio General";
        const titleString = "ECOSISTEMA";
        const subTextString = "Un ecosistema para el conocimiento, la formación y la práctica interdisciplinaria.";
        const expTitleString = "EXPLORACIÓN INTERACTIVA DEL ECOSISTEMA.";
        const expDescString = "Observe la animación superior en la palabra QUIMERA. Una vez que la palabra completa se torne de color blanco, cada letra parpadeará secuencialmente en rojo y blanco. Haga clic en la letra activa para abrir el recuadro central con su respectiva información fundamental.";
        const footer1String = "© 2026 Instituto Quimera • Centro de Investigación, Docencia, Servicio y Difusión.";
        const footer2String = "Dr.C. Cesar Cerezo Camacho. Todos los derechos reservados.";

        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('intro-overlay');

            // 1. Inicialmente blanco (500 ms) y luego pasa a negro (500 ms)
            setTimeout(() => {
                overlay.style.background = '#000000';
                setTimeout(() => {
                    overlay.style.opacity = '0'; // Se desvanece a negro
                    setTimeout(() => {
                        startSequence();
                    }, 500);
                }, 500);
            }, 500);
        });

        // Función de máquina de escribir estándar (con cursor)
        function typeWriterSimple(elementId, text, speed, callback) {
            const el = document.getElementById(elementId);
            let i = 0;
            el.innerHTML = "";
            let cursor = document.createElement('span');
            cursor.className = 'tw-cursor';
            el.appendChild(cursor);

            function type() {
                if (i < text.length) {
                    el.innerHTML = text.substring(0, i + 1);
                    el.appendChild(cursor);
                    i++;
                    setTimeout(type, speed);
                } else {
                    cursor.remove();
                    if (callback) callback();
                }
            }
            type();
        }

        // Función de máquina de escribir sin cursor al finalizar
        function typeWriterNoCursor(elementId, text, speed, callback) {
            const el = document.getElementById(elementId);
            let i = 0;
            el.innerHTML = "";

            function type() {
                if (i < text.length) {
                    el.innerHTML = text.substring(0, i + 1);
                    i++;
                    setTimeout(type, speed);
                } else {
                    if (callback) callback();
                }
            }
            type();
        }

        function startSequence() {
            // Segundo: Aparece el header
            const topHeader = document.getElementById('top-header');
            topHeader.classList.add('visible');

            // Tercero: El texto del header con máquina de escribir, sin cursor
            setTimeout(() => {
                typeWriterNoCursor('header-link', headerLinkString, 35, () => {
                    // Cuarto: La palabra ECOSISTEMA con máquina de escribir, sin cursor
                    const mainTitle = document.getElementById('main-title');
                    mainTitle.classList.add('visible');
                    typeWriterNoCursor('main-title', titleString, 40, () => {
                        // Quinto: Animación de la palabra QUIMERA
                        const quimeraContainer = document.getElementById('quimera-word');
                        quimeraContainer.classList.add('visible');
                        playQuimeraAppearance();
                    });
                });
            }, 300);
        }

        const letters = document.querySelectorAll('.quimera-letter');
        let currentLetterIndex = 0;
        let selectedCount = 0;
        let activeBlinkInterval = null;
        let globalBlinkInterval = null;

        function playQuimeraAppearance() {
            let idx = 0;
            function showNextRed() {
                if (idx < letters.length) {
                    letters[idx].style.color = '#dc2626';
                    idx++;
                    setTimeout(showNextRed, 250);
                } else {
                    setTimeout(showWhiteLetters, 300);
                }
            }
            showNextRed();
        }

        function showWhiteLetters() {
            let idx = 0;
            function showNextWhite() {
                if (idx < letters.length) {
                    letters[idx].style.color = '#ffffff';
                    idx++;
                    setTimeout(showNextWhite, 200);
                } else {
                    // El texto del subtítulo
                    const subEl = document.getElementById('sub-text');
                    subEl.classList.add('visible');
                    typeWriterSimple('sub-text', subTextString, 15, () => {
                        // Sexto: Recuadro de las instrucciones de la exploración interactiva
                        const expEl = document.getElementById('exp-box');
                        expEl.classList.add('visible');
                        typeWriterSimple('exp-title', expTitleString, 15, () => {
                            typeWriterSimple('exp-desc', expDescString, 10, () => {
                                // Séptimo: Aparece el footer
                                const footerEl = document.getElementById('main-footer');
                                footerEl.classList.add('visible');
                                setTimeout(() => {
                                    // Octavo: El texto del footer con máquina de escribir, sin cursor
                                    typeWriterNoCursor('footer-text-1', footer1String, 10, () => {
                                        typeWriterNoCursor('footer-text-2', footer2String, 10, () => {
                                            activateCurrentLetter();
                                        });
                                    });
                                }, 400);
                            });
                        });
                    });
                }
            }
            showNextWhite();
        }

        function activateCurrentLetter() {
            if (currentLetterIndex >= letters.length) return;
            const targetLetter = letters[currentLetterIndex];
            let isWhite = true;

            activeBlinkInterval = setInterval(() => {
                targetLetter.style.color = isWhite ? '#dc2626' : '#ffffff';
                isWhite = !isWhite;
            }, 300);

            targetLetter.style.cursor = 'pointer';
            targetLetter.onclick = () => handleLetterClick(currentLetterIndex);
        }

        function handleLetterClick(index) {
            const targetLetter = letters[index];
            targetLetter.onclick = null;
            clearInterval(activeBlinkInterval);

            let blinks = 0;
            let isWhite = false;
            const blinkFive = setInterval(() => {
                targetLetter.style.color = isWhite ? '#ffffff' : '#dc2626';
                isWhite = !isWhite;
                blinks++;
                if (blinks >= 10) {
                    clearInterval(blinkFive);
                    targetLetter.style.color = '#ffffff';
                    showModal(index);
                }
            }, 50);
        }

        function showModal(index) {
            const backdrop = document.getElementById('modal-backdrop');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            const closeBtn = document.getElementById('modal-close-btn');

            modalTitle.innerHTML = "";
            modalBody.innerHTML = "";
            backdrop.classList.add('active');

            const data = modalData[index];

            let titleCursor = document.createElement('span');
            titleCursor.className = 'tw-cursor';
            modalTitle.appendChild(titleCursor);

            let tIdx = 0;
            function typeModalTitle() {
                if (tIdx < data.title.length) {
                    modalTitle.innerHTML = data.title.substring(0, tIdx + 1);
                    modalTitle.appendChild(titleCursor);
                    tIdx++;
                    setTimeout(typeModalTitle, 20);
                } else {
                    titleCursor.remove();
                    typeModalBodyContent(0);
                }
            }
            setTimeout(typeModalTitle, 300);

            function typeModalBodyContent(contentIndex) {
                if (contentIndex >= data.content.length) {
                    let finalCursor = document.createElement('span');
                    finalCursor.className = 'tw-cursor';
                    modalBody.appendChild(finalCursor);
                    return;
                }

                let item = data.content[contentIndex];
                if (item.type === 'p') {
                    let pElem = document.createElement('p');
                    let pCursor = document.createElement('span');
                    pCursor.className = 'tw-cursor';
                    pElem.appendChild(pCursor);
                    modalBody.appendChild(pElem);

                    let pIdx = 0;
                    function typeP() {
                        if (pIdx < item.text.length) {
                            pElem.innerHTML = item.text.substring(0, pIdx + 1);
                            pElem.appendChild(pCursor);
                            pIdx++;
                            setTimeout(typeP, 12);
                        } else {
                            pCursor.remove();
                            setTimeout(() => typeModalBodyContent(contentIndex + 1), 150);
                        }
                    }
                    typeP();
                } else if (item.type === 'flow') {
                    let flowElem = document.createElement('div');
                    flowElem.className = 'process-flow';
                    flowElem.textContent = item.text;
                    modalBody.appendChild(flowElem);
                    setTimeout(() => typeModalBodyContent(contentIndex + 1), 200);
                } else if (item.type === 'ul') {
                    let ulElem = document.createElement('ul');
                    modalBody.appendChild(ulElem);
                    let liIdx = 0;
                    function typeLi() {
                        if (liIdx < item.items.length) {
                            let liElem = document.createElement('li');
                            let liText = item.items[liIdx];
                            let liCursor = document.createElement('span');
                            liCursor.className = 'tw-cursor';
                            liElem.appendChild(liCursor);
                            ulElem.appendChild(liElem);

                            let lCharIdx = 0;
                            function typeLChar() {
                                if (lCharIdx < liText.length) {
                                    liElem.innerHTML = liText.substring(0, lCharIdx + 1);
                                    liElem.appendChild(liCursor);
                                    lCharIdx++;
                                    setTimeout(typeLChar, 10);
                                } else {
                                    liCursor.remove();
                                    liIdx++;
                                    setTimeout(typeLi, 100);
                                }
                            }
                            typeLChar();
                        } else {
                            setTimeout(() => typeModalBodyContent(contentIndex + 1), 150);
                        }
                    }
                    typeLi();
                }
            }

            closeBtn.onclick = () => {
                backdrop.classList.remove('active');
                setTimeout(() => {
                    letters[index].style.color = '#dc2626';
                    currentLetterIndex++;
                    selectedCount++;

                    if (selectedCount < 7) {
                        activateCurrentLetter();
                    } else {
                        enableFinalHyperlink();
                    }
                }, 800);
            };
        }

        function enableFinalHyperlink() {
            const wordContainer = document.getElementById('quimera-word');
            wordContainer.style.cursor = 'pointer';

            let isWhite = true;
            globalBlinkInterval = setInterval(() => {
                letters.forEach(l => {
                    l.style.color = isWhite ? '#ffffff' : '#dc2626';
                });
                isWhite = !isWhite;
            }, 100);

            // Noveno: Salida ordenada de la página al hacer clic en la palabra QUIMERA parpadeante
            wordContainer.onclick = () => {
                clearInterval(globalBlinkInterval);

                const overlay = document.getElementById('intro-overlay');
                overlay.style.transition = 'opacity 2000ms ease';
                overlay.style.background = '#000000';
                overlay.style.opacity = '1';

                // A) Texto del footer
                document.getElementById('footer-text-1').style.opacity = '0';
                document.getElementById('footer-text-2').style.opacity = '0';

                // B) Footer
                setTimeout(() => {
                    document.getElementById('main-footer').style.opacity = '0';
                }, 200);

                // C) Texto del recuadro "Exploración Interactiva del Ecosistema"
                setTimeout(() => {
                    document.getElementById('exp-title').style.opacity = '0';
                    document.getElementById('exp-desc').style.opacity = '0';
                }, 400);

                // D) Recuadro "Exploración Interactiva del Ecosistema"
                setTimeout(() => {
                    document.getElementById('exp-box').style.opacity = '0';
                }, 600);

                // E) El texto del subtítulo
                setTimeout(() => {
                    document.getElementById('sub-text').style.opacity = '0';
                }, 800);

                // F) La palabra QUIMERA
                setTimeout(() => {
                    document.getElementById('quimera-word').style.opacity = '0';
                }, 1000);

                // G) La palabra ECOSISTEMA
                setTimeout(() => {
                    document.getElementById('main-title').style.opacity = '0';
                }, 1200);

                // H) La frase QUIMERA - Inicio General (Header)
                setTimeout(() => {
                    document.getElementById('top-header').style.opacity = '0';
                }, 1400);

                // I) La imagen de fondo / Desvanecimiento en blanco en 500ms al final
                setTimeout(() => {
                    overlay.style.transition = 'background 500ms ease, opacity 500ms ease';
                    overlay.style.background = '#ffffff';
                    overlay.style.opacity = '1';
                    setTimeout(() => {
                        window.location.href = "https://quimerac3.github.io/QuimeraC3-Q/";
                    }, 500);
                }, 1800);
            };
        }
    </script>
