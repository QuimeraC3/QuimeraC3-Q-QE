<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quimera &bull; Ecosistema Científico, Académico y Profesional</title>
    <style>
        :root {
            --card-bg: rgba(15, 23, 42, 0.90);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #0f766e;
            --accent: #dc2626;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Body dinámico según el dispositivo */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #000000;
            color: var(--text-main);
            width: 100vw;
            min-height: 100vh;
            position: relative;
        }

        @media (min-width: 769px) {
            body {
                overflow: hidden;
                height: 100vh;
            }
        }

        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                height: auto;
            }
        }

        /* Imagen de fondo independiente */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(11, 19, 41, 0.85), rgba(11, 19, 41, 0.10)), url('Quimera.png');
            background-size: cover;
            background-position: center center;
            z-index: -1;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .bg-image.visible {
            opacity: 1;
        }

        /* LIENZO MAESTRO ESCALABLE (Escritorio y Modo Sitio Web en Móvil) */
        .scaler-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1920px;
            height: 1080px;
            transform-origin: center center;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: none;
        }

        .interactive-zone {
            pointer-events: auto;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Header Superior Izquierda */
        .top-header {
            position: absolute;
            top: 40px;
            left: 60px;
            z-index: 10;
        }

        .top-header a {
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: -0.01em;
            transition: color 0.2s ease;
            opacity: 0;
        }

        .top-header a:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        /* Header Superior Derecha */
        .top-header-right {
            position: absolute;
            top: 40px;
            right: 60px;
            z-index: 10;
            display: flex;
            gap: 1.5rem;
        }

        .top-header-right a {
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            opacity: 0;
            transition: color 0.2s ease, opacity 0.8s ease, background-color 0.3s ease;
            background: rgba(15, 118, 110, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 20px;
        }

        .top-header-right a.visible {
            opacity: 1;
        }

        .top-header-right a:hover {
            background: var(--primary);
            color: #ffffff;
            text-decoration: none;
        }

        /* Capa de desvanecimiento inicial en blanco */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease;
        }

        #intro-overlay.fade-out {
            opacity: 0;
        }

        /* Título Principal ECOSISTEMA */
        .page-title {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #c88b32;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            white-space: nowrap;
            opacity: 0;
        }

        /* Subtítulo QUIMERA */
        .quimera-word-container {
            position: absolute;
            top: 580px;
            left: 50%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 6.5rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            cursor: default;
            opacity: 0;
            transition: opacity 0.8s ease;
            white-space: nowrap;
        }

        .quimera-word-container.visible {
            opacity: 1;
        }

        .quimera-letter {
            display: inline-block;
            color: #ffffff;
            transition: color 0.4s ease;
        }

        /* Subtítulo de texto */
        .subtitle-text {
            position: absolute;
            top: 700px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.6rem;
            line-height: 1.6;
            max-width: 1100px;
            width: 90%;
            color: #e2e8f0;
            text-align: center;
            opacity: 0;
        }

        /* Recuadro de instrucciones interactivo */
        .exploration-box {
            position: absolute;
            top: 950px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 1350px;
            width: 85%;
            padding: 0.2rem 0.2rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            font-size: 0.95rem;
            color: #cbd5e1;
            opacity: 0;
            transition: opacity 0.8s ease;
            text-align: center;
        }

        .exploration-box.visible {
            opacity: 1;
        }

        #exp-title {
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 0.3rem;
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 500ms ease;
        }

        footer.visible {
            opacity: 1;
        }

        footer p {
            color: #ffffff;
        }

        /* ADAPTACIÓN MÓVIL (Modo Celular Normal: Pantallas <= 768px) */
        @media (max-width: 768px) {
            .scaler-container {
                position: relative !important;
                width: 100% !important;
                height: auto !important;
                transform: none !important;
                top: auto !important;
                left: auto !important;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 5rem 1rem 3rem 1.5rem;
            }

            .interactive-zone {
                position: relative !important;
                width: 100% !important;
                height: auto !important;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.5rem;
            }

            .top-header {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                text-align: center;
                margin-bottom: 0.5rem;
            }

            .top-header-right {
                position: relative !important;
                top: auto !important;
                right: auto !important;
                justify-content: center;
                flex-wrap: wrap;
                gap: 0.8rem;
                margin-bottom: 1rem;
            }

            .page-title {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                font-size: 1.8rem !important;
                text-align: center;
                white-space: normal !important;
                margin: 0.5rem 0 !important;
            }

            .quimera-word-container {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                font-size: 3rem !important;
                text-align: center;
                white-space: normal !important;
                margin: 0.5rem 0 !important;
            }

            .subtitle-text {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                font-size: 1.1rem !important;
                width: 100% !important;
                margin: 0.5rem 0 !important;
            }

            .exploration-box {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                width: 100% !important;
                margin: 0.5rem 0 !important;
                padding: 1rem !important;
            }

            footer {
                position: relative !important;
                bottom: auto !important;
                left: auto !important;
                transform: none !important;
                margin-top: 2rem !important;
            }
        }

        /* Recuadro Central Modal */
        #modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;

        #modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 750px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            text-align: left;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            transform-origin: center center;
        }

        @keyframes tvShutdown {
            0% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
            40% { transform: scale(1, 0.005); filter: brightness(3); opacity: 1; }
            70% { transform: scale(0.001, 0.005); filter: brightness(5); opacity: 1; }
            100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
        }

        .modal-box.crt-exit {
            animation: tvShutdown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }

</head>

    <script>
        // Subprograma inteligente de escalado dinámico
        function updateScreenScale() {
            const scaler = document.getElementById('scalerContainer');
            if (window.innerWidth <= 768) {
                // Modo Celular Normal: Desactiva el escalado absoluto y usa flujo vertical responsivo
                scaler.style.transform = 'none';
                scaler.style.position = 'relative';
                scaler.style.width = '100%';
                scaler.style.height = 'auto';
            } else {
                // Modo Escritorio / Sitio Web de Escritorio en Celular: Activa el lienzo maestro de 1920x1080
                scaler.style.position = 'absolute';
                scaler.style.width = '1920px';
                scaler.style.height = '1080px';
                const baseW = 1920;
                const baseH = 1080;
                const scaleX = window.innerWidth / baseW;
                const scaleY = window.innerHeight / baseH;
                const scale = Math.min(scaleX, scaleY);
                scaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
            }
        }

        window.addEventListener('resize', updateScreenScale);
        window.addEventListener('DOMContentLoaded', updateScreenScale);

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                window.location.reload();
            }
        });

        // Control de Reproducción de Música
        const music = document.getElementById('bg-music');
        const musicLink = document.getElementById('music-link');
        let isMusicPlaying = false;

        musicLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (isMusicPlaying) {
                music.pause();
                musicLink.textContent = '🎵 Música: OFF';
                isMusicPlaying = false;
            } else {
                music.play().then(() => {
                    musicLink.textContent = '🎶 Música: ON';
                    isMusicPlaying = true;
                }).catch(error => {
                    console.log("Error al reproducir audio:", error);
                });
            }
        });

        // Control de Pantalla Completa
        const fullscreenLink = document.getElementById('fullscreen-link');

        fullscreenLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fullscreenLink.textContent = '❌ Salir Pantalla Completa';
                }).catch(err => {
                    console.log("Error al intentar entrar en pantalla completa:", err);
                });
            } else {
                document.exitFullscreen().then(() => {
                    fullscreenLink.textContent = '⛶ Pantalla Completa';
                });
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {

                fullscreenLink.textContent = '❌ Salir Pantalla Completa';

        function typeWriter(elementId, text, speed = 35) {
            return new Promise(resolve => {
                const el = document.getElementById(elementId);
                el.innerHTML = '';
                el.style.opacity = 1; 
                let i = 0;
                function type() {
                    if (i < text.length) {
                        el.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        function typeWriterHTML(element, htmlString, speed = 20) {
            return new Promise(resolve => {
                element.innerHTML = '';
                const tokens = htmlString.match(/(<\/?[^>]+(>|$)|[^<]+)/g) || [htmlString];
                let tokenIdx = 0;
                let charIdx = 0;
                
                function type() {
                    if (tokenIdx < tokens.length) {
                        let currentToken = tokens[tokenIdx];
                        if (currentToken.startsWith('<')) {
                            element.innerHTML += currentToken;
                            tokenIdx++;
                            setTimeout(type, speed);
                        } else {
                            if (charIdx < currentToken.length) {
                                element.innerHTML += currentToken.charAt(charIdx);
                                charIdx++;
                                setTimeout(type, speed);
                            } else {
                                charIdx = 0;
                                tokenIdx++;
                                setTimeout(type, speed);
                            }
                        }
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        async function runIntroSequence() {
            const whiteOverlay = document.getElementById('intro-overlay');
            whiteOverlay.classList.add('fade-out');
            await new Promise(r => setTimeout(r, 1000));

            document.getElementById('bg-image').classList.add('visible');
            await new Promise(r => setTimeout(r, 1000));

            await typeWriter('header-link', 'QUIMERA - Inicio General', 40);

            document.getElementById('music-link').classList.add('visible');
            await new Promise(r => setTimeout(r, 400));

            document.getElementById('fullscreen-link').classList.add('visible');
            await new Promise(r => setTimeout(r, 600));

            await typeWriter('main-title', 'ECOSISTEMA', 80);
            await new Promise(r => setTimeout(r, 400));

            document.getElementById('quimera-word').classList.add('visible');
            await new Promise(r => setTimeout(r, 800));
            await playQuimeraAppearanceAsync();
            await new Promise(r => setTimeout(r, 400));

            await typeWriter('sub-text', 'Un ecosistema para el conocimiento, la formación y la práctica interdisciplinaria.', 35);
            await new Promise(r => setTimeout(r, 400));

            document.getElementById('exp-box').classList.add('visible');
            await new Promise(r => setTimeout(r, 600));

            await typeWriter('exp-title', 'EXPLORACIÓN INTERACTIVA DEL ECOSISTEMA: Una vez que la palabra QUIMERA cambie de color a blanco, seleccione la letra parpadeante para descubrir: ¿Qué es QUIMERA?', 25);
            await new Promise(r => setTimeout(r, 400));

            document.querySelector('footer').classList.add('visible');
            await new Promise(r => setTimeout(r, 600));

            const currentYear = new Date().getFullYear();
            const footerString = `• © ${currentYear} Instituto Quimera. • Centro de Investigación, Docencia, Servicio y Difusión. • Dr.C. Cesar Cerezo Camacho. • Todos los derechos reservados. •`;
            await typeWriter('footer-text', footerString, 20);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(runIntroSequence, 400);

            document.getElementById('header-link').addEventListener('click', (e) => {
                e.preventDefault();
                const overlay = document.getElementById('intro-overlay');
                overlay.style.background = '#ffffff';
                overlay.style.opacity = '1';
                overlay.classList.remove('fade-out');
                setTimeout(() => {
                    window.location.href = "https://quimerac3.github.io/";
                }, 500);
            });
        });

        const letters = document.querySelectorAll('.quimera-letter');
        let currentLetterIndex = 0;
        let selectedCount = 0;
        let activeBlinkInterval = null;
        let globalColorInterval = null;

        function playQuimeraAppearanceAsync() {
            return new Promise(resolve => {
                let idx = 0;
                function showNextRed() {
                    if (idx < letters.length) {
                        letters[idx].style.color = '#dc2626';
                        idx++;
                        setTimeout(showNextRed, 200);
                    } else {
                        setTimeout(showWhiteLetters, 250);
                    }
                }
                function showWhiteLetters() {
                    let jdx = 0;
                    function showNextWhite() {
                        if (jdx < letters.length) {
                            letters[jdx].style.color = '#ffffff';
                            jdx++;
                            setTimeout(showNextWhite, 150);
                        } else {
                            activateCurrentLetter();
                            resolve();
                        }
                    }
                    showNextWhite();
                }
                showNextRed();
            });
        }

        function activateCurrentLetter() {
            if (currentLetterIndex >= letters.length) return;
            const targetLetter = letters[currentLetterIndex];
            let isWhite = true;

            activeBlinkInterval = setInterval(() => {
                targetLetter.style.color = isWhite ? '#dc2626' : '#ffffff';
                isWhite = !isWhite;
            }, 300);

            targetLetter.style.cursor = 'pointer';
            targetLetter.onclick = () => handleLetterClick(currentLetterIndex);
        }

        function handleLetterClick(index) {
            const targetLetter = letters[index];
            targetLetter.onclick = null;
            clearInterval(activeBlinkInterval);

            let blinks = 0;
            let isWhite = false;
            const blinkFive = setInterval(() => {
                targetLetter.style.color = isWhite ? '#ffffff' : '#dc2626';
                isWhite = !isWhite;
                blinks++;
                if (blinks >= 10) {
                    clearInterval(blinkFive);
                    targetLetter.style.color = '#ffffff';
                    showModalTyped(index);
                }
            }, 100);
        }

        async function showModalTyped(index) {
            const backdrop = document.getElementById('modal-backdrop');
            const modalBox = document.getElementById('modal-content-box');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');

            modalBox.classList.remove('crt-exit');
            modalBox.style.opacity = '1';
            modalBox.style.transform = 'scale(1,1)';
            
            modalTitle.innerHTML = "";
            modalBody.innerHTML = "";
            
            backdrop.classList.add('active');

            const data = modalData[index];
            
            await typeWriterHTML(modalTitle, data.title, 25);

            for (let item of data.content) {
                if (item.type === 'p') {
                    let pElem = document.createElement('p');
                    modalBody.appendChild(pElem);
                    await typeWriterHTML(pElem, item.text, 12);
                } else if (item.type === 'flow') {
                    let flowElem = document.createElement('div');
                    flowElem.className = 'process-flow';
                    modalBody.appendChild(flowElem);
                    await typeWriterHTML(flowElem, item.text, 12);
                } else if (item.type === 'ul') {
                    let ulElem = document.createElement('ul');
                    modalBody.appendChild(ulElem);
                    for (let liText of item.items) {
                        let liElem = document.createElement('li');
                        ulElem.appendChild(liElem);
                        await typeWriterHTML(liElem, liText, 12);
                    }
                }
            }

            let closeContainer = document.createElement('div');
            closeContainer.style.textAlign = 'right';
            closeContainer.style.marginTop = '1.5rem';

            let closeBtn = document.createElement('span');
            closeBtn.className = 'close-link';
            closeBtn.id = 'modal-close-btn';
            closeBtn.textContent = 'Cerrar.';

            let cursor = document.createElement('span');
            cursor.style.display = 'inline-block';
            cursor.style.width = '8px';
            cursor.style.height = '1.1em';
            cursor.style.background = '#f43f5e';
            cursor.style.marginLeft = '4px';
            cursor.style.verticalAlign = 'middle';
            cursor.style.animation = 'blinkCursor 0.8s infinite';

            closeContainer.appendChild(closeBtn);
            closeContainer.appendChild(cursor);
            modalBody.appendChild(closeContainer);

            const triggerClose = () => {
                closeBtn.onclick = null;
                backdrop.onclick = null;

                modalBox.classList.add('crt-exit');

                setTimeout(() => {
                    backdrop.classList.remove('active');

                    letters[index].style.color = '#dc2626';
                    currentLetterIndex++;
                    selectedCount++;

                    if (selectedCount < 7) {
                        activateCurrentLetter();
                    } else {
                        enableFinalHyperlink();
                    }
                }, 400);
            };

            closeBtn.onclick = triggerClose;
            backdrop.onclick = (e) => {
                if (e.target === backdrop) {
                    triggerClose();
                }
            };
        }

        function enableFinalHyperlink() {
            const wordContainer = document.getElementById('quimera-word');
            wordContainer.style.cursor = 'pointer';

            const stepTime = 500 / letters.length;

            function runSequence() {
                let i = 0;
                function turnRed(callback) {
                    if (i < letters.length) {
                        letters[i].style.color = '#dc2626';
                        i++;
                        globalColorInterval = setTimeout(() => turnRed(callback), stepTime);
                    } else if (callback) {
                        callback();
                    }
                }

                let j = 0;
                function turnWhite(callback) {
                    if (j < letters.length) {
                        letters[j].style.color = '#ffffff';
                        j++;
                        globalColorInterval = setTimeout(() => turnWhite(callback), stepTime);
                    } else if (callback) {
                        callback();
                    }
                }

                turnRed(() => {
                    i = 0;
                    turnWhite(() => {
                        j = 0;
                        globalColorInterval = setTimeout(runSequence, 0);
                    });
                });
            }

            runSequence();

            wordContainer.onclick = () => {
                clearTimeout(globalColorInterval);
                const overlay = document.getElementById('intro-overlay');
                overlay.style.background = '#ffffff';
                overlay.style.opacity = '1';
                overlay.classList.remove('fade-out');

                setTimeout(() => {
                    window.location.href = "https://quimerac3.github.io/QuimeraC3-Q/";
                }, 500);
            };
        }
    </script>
</body>
